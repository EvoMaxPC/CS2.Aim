# SPDX-License-Identifier: Apache-2.0
# electron-builder configuration for EVO-AIM-CS2 (Layer 1 — SPIKE-4)
# Code signing environment variables (CSC_LINK, CSC_KEY_PASSWORD, WIN_CSC_LINK)
# are intentionally empty by default in open-source dev/CI builds (ADR-0017, R17).

appId: io.github.evomaxpc.evoaim
productName: EVO-AIM-CS2
copyright: Copyright 2026 EVO-AIM-CS2 contributors

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - '**/*.node'
  - '**/node_modules/better-sqlite3/**'

npmRebuild: false
afterPack: ./scripts/after-pack-fuses.cjs

win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Game
  maintainer: EVO-AIM-CS2 contributors
  synopsis: Open-source Counter-Strike 2 aim training platform
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

mac:
  category: public.app-category.games
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
