name: Bug Report
description: Reportar un fallo reproducible en EVO-AIM-CS2
title: '[Bug]: '
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar a mejorar **EVO-AIM-CS2**. Por favor, completa los campos con datos precisos para que podamos reproducir el problema.
        *(Si encontraste una vulnerabilidad de seguridad, **NO** uses este formulario: repórtala en privado según `SECURITY.md`).*

  - type: textarea
    id: description
    attributes:
      label: Descripción del fallo
      description: ¿Qué ocurrió exactamente y qué esperabas que ocurriera?
      placeholder: Al iniciar el ejercicio X con sensibilidad Y...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Enumera los pasos exactos para reproducir el problema de forma consistente.
      value: |
        1. Abrir...
        2. Configurar...
        3. Observar...
    validations:
      required: true

  - type: dropdown
    id: os_platform
    attributes:
      label: Sistema operativo (Plataforma)
      options:
        - Windows 11 x64 (Tier 1)
        - Windows 10 x64 (Tier 1)
        - Linux x64 — X11 (Tier 2)
        - Linux x64 — Wayland (Tier 2)
        - macOS Apple Silicon / Intel (Tier 3 best-effort)
        - Windows ARM64 (Tier 3 best-effort)
        - Otro (especificar abajo)
    validations:
      required: true

  - type: dropdown
    id: hardware_tier
    attributes:
      label: Tier de hardware aproximado
      description: Según docs/HARDWARE_TIERS.md
      options:
        - Tier L (iGPU / GPU antigua, 60 Hz)
        - Tier M (GPU dedicada media, 120–165 Hz)
        - Tier H (GPU actual gama alta, 240–360+ Hz)
        - No estoy seguro
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Detalles del entorno y periféricos
      description: Versión de EVO-AIM-CS2, distribución Linux (si aplica), CPU/GPU, Hz del monitor, DPI y polling rate del ratón. No incluyas rutas con datos personales.
      value: |
        - Versión de EVO-AIM-CS2 / commit:
        - SO exacto:
        - GPU / Driver:
        - Monitor (resolución y Hz):
        - Ratón (DPI y polling rate Hz):
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs o evidencia adicional (opcional)
      description: Pega fragmentos relevantes de logs (revisa antes que no contengan nombres de usuario ni rutas privadas).
      render: text
