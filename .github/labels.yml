# --- Priority ---
- name: 'priority:p0'
  color: 'B60205'
  description: 'Critical blocker: data loss, security vulnerability, or broken aim fidelity'
- name: 'priority:p1'
  color: 'D93F0B'
  description: 'High priority: blocks active layer completion or major quality bar'
- name: 'priority:p2'
  color: 'FBCA04'
  description: 'Medium priority: planned work within roadmap'
- name: 'priority:p3'
  color: '0E8A16'
  description: 'Low priority: nice-to-have improvement or polish'

# --- Workflow, Verification & Open Source Community ---
- name: 'status:blocked'
  color: 'B60205'
  description: 'Blocked by external verification, spike outcome, or owner decision'
- name: 'needs-verification'
  color: 'FBCA04'
  description: 'Data, formula, or platform behavior requires empirical/primary source verification'
- name: 'good first issue'
  color: '7057FF'
  description: 'Well-scoped task suitable for first-time open-source contributors'
- name: 'help wanted'
  color: '008672'
  description: 'Extra community attention welcome (hardware testing, Linux/Wayland, data audit)'
- name: 'dco-missing'
  color: 'E4E669'
  description: 'One or more commits are missing the required DCO Signed-off-by trailer'
