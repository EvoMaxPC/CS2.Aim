# --- Issue / PR Types ---
- name: 'type:bug'
  color: 'D73A4A'
  description: 'Reproducible defect or regression'
- name: 'type:feature'
  color: 'A2EEEF'
  description: 'New feature or enhancement aligned with roadmap'
- name: 'type:docs'
  color: '0075CA'
  description: 'Documentation, ADRs, or guides'
- name: 'type:data'
  color: 'FBCA04'
  description: 'CS2 weapon stats, formulas, or peer-reviewed scientific references'

